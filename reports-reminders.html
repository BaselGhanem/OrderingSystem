<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة واتساب أو إيميل</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{margin:0;padding:16px;background:#f5f9f9;font-family:Cairo,Arial,sans-serif;color:#153c4a}*{box-sizing:border-box}button,input{font:inherit}

.approval-reminder-person{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.approval-reminder-person h3{margin:0;font-size:1rem;color:#123c5a}.approval-reminder-role{font-size:.76rem;color:#718391;margin-top:3px}.approval-reminder-contact{font-size:.76rem;color:#607482;direction:ltr;text-align:left}.approval-reminder-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.approval-reminder-stat{padding:10px;border-radius:11px;background:#f5f9fb}.approval-reminder-stat span{display:block;font-size:.72rem;color:#748895}.approval-reminder-stat strong{display:block;margin-top:3px;color:#123c5a;font-size:.98rem}

body.orders-staff-reminder-mode .workflow-stats-grid,body.orders-staff-reminder-mode .workflow-filters,body.orders-staff-reminder-mode .workflow-toolbar,body.orders-staff-reminder-mode .workflow-table-wrap{display:none!important}

</style></head><body data-page="reports-reminders"><main><section class="approval-reminder-panel" id="approvalReminderPanel"><div class="approval-reminder-head"><div><h2>تذكير بالموافقات المعلقة</h2><p>نفس متابعة قسم الطلبيات: اعرض الطلبات المنتظرة، راجع الرسالة، ثم افتح واتساب أو الإيميل.</p></div><button class="approval-reminder-refresh" id="refreshApprovalRemindersBtn" type="button">تحديث</button></div><div class="approval-reminder-date-filters"><div><label for="reminderDateFrom">من تاريخ</label><input id="reminderDateFrom" type="date"></div><div><label for="reminderDateTo">إلى تاريخ</label><input id="reminderDateTo" type="date"></div></div><div class="approval-reminder-warning" id="approvalReminderWarning" hidden></div><div class="approval-reminder-grid" id="approvalReminderGrid"><div class="approval-reminder-loading">جاري تحميل الطلبيات المعلقة...</div></div></section></main><script type="module" src="js/orders-staff-reminders.js?v=20260923_reports_v1"></script></body></html>
