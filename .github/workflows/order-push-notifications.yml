name: Order push notifications

on:
  schedule:
    - cron: '30 5-13 * * 0-4'
    - cron: '0 6-14 * * 0-4'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even outside the normal Amman schedule'
        required: false
        default: false
        type: boolean
      test_user:
        description: 'Optional: send one real Web Push test only'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - hamza_shbatee
          - ziad_hourany
          - zakaria
          - mohammad_amira
          - abdallah_alnatour
          - mohammad_tawalbeh

permissions:
  contents: read

concurrency:
  group: order-push-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install notification dependencies
        run: npm install --no-save firebase@12.19.0 web-push@3.6.7

      - name: Send notifications
        env:
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || false }}
          TEST_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_user || '' }}
        run: node scripts/send-order-push-notifications.mjs
