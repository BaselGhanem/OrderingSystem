name: Unify Order Status Logic

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  unify-status:
    if: github.event.issue.title == '[automation] unify-order-status'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beforeChatGPT
          fetch-depth: 0

      - name: Apply canonical status patch
        run: python3 .status-unify/patch.py

      - name: Validate JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/workflow.js

      - name: Commit unified status logic
        run: |
          rm -rf .status-unify
          rm -f .github/workflows/unify-order-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify order status logic with audit center"
          git push origin HEAD:beforeChatGPT

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Status unification completed."
