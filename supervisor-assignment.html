<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير مشرف المندوب</title>
</head>
<body>
<script>
(async () => {
    const response = await fetch(`supervisor-assignment.status-source.html?v=20260722_status_unified_v4`);
    if (!response.ok) throw new Error(`Unable to load supervisor assignment source: ${response.status}`);

    let html = await response.text();
    const oldStatusResolver = `      const status=String(order.status||order.workflowStage||'').trim();`;
    const canonicalStatusResolver = `      const status=String(order.status||order.workflowStage||order.supervisorStatus||order.marketManagerStatus||order.financeStatus||order.orderStaffStatus||'').trim();`;

    if (!html.includes(oldStatusResolver)) {
        throw new Error(`Supervisor assignment status resolver was not found.`);
    }

    html = html.replace(oldStatusResolver, canonicalStatusResolver);

    document.open();
    document.write(html);
    document.close();
})().catch(error => {
    console.error(error);
    document.body.innerHTML = `<main style="font-family:Arial,sans-serif;padding:30px;text-align:center;color:#b42318">تعذر تحميل صفحة تغيير المشرف. يرجى تحديث الصفحة.</main>`;
});
</script>
</body>
</html>
