<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>الدخول | نظام المرتجعات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css?v=20260922_firestore_users_v4">
</head>
<body data-page="login">
<div class="shell login-shell">
    <header class="login-brand">
        <img src="https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png" alt="Dar Al Dawaa">
        <div><h1>نظام المرتجعات</h1><p>دخول نظام المرتجعات</p></div>
    </header>
    <div id="banner" class="banner"></div>

    <section id="roleStep" class="role-grid role-grid-three">
        <button class="role-card" data-login-role="representative">
            <span class="role-icon"><i class="ph ph-briefcase"></i></span>
            <span><strong>مندوب</strong><small>إدخال ومتابعة المرتجعات</small></span>
            <i class="ph ph-arrow-left role-arrow"></i>
        </button>
        <button class="role-card" data-login-role="supervisor">
            <span class="role-icon"><i class="ph ph-users-three"></i></span>
            <span><strong>مشرف</strong><small>مراجعة مرتجعات الفريق</small></span>
            <i class="ph ph-arrow-left role-arrow"></i>
        </button>
        <button class="role-card" data-login-role="staff">
            <span class="role-icon"><i class="ph ph-shield-check"></i></span>
            <span><strong>الإدارة</strong><small>رئيس الطلبيات، مدير السوق، المالية، Admin والتقارير</small></span>
            <i class="ph ph-arrow-left role-arrow"></i>
        </button>
    </section>

    <section id="repLoginPanel" class="card login-panel hidden">
        <div class="title-row"><div><h2>دخول المندوب</h2><p>اختر اسمك وأدخل كلمة السر الحالية. اختيار الصيدلية يتم بعد نجاح الدخول.</p></div><button class="btn secondary back-roles"><i class="ph ph-arrow-right"></i> رجوع</button></div>
        <div class="grid">
            <div class="field wide"><label>اسم المندوب</label><select id="loginRep"><option value="">اختر المندوب</option></select></div>
            <div class="field"><label>كلمة السر</label><input id="loginRepPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>
        </div>
        <div class="login-submit"><button id="repLoginButton" class="btn primary"><i class="ph ph-sign-in"></i> دخول المرتجعات</button></div>
    </section>

    <section id="supervisorLoginPanel" class="card login-panel hidden">
        <div class="title-row"><div><h2>دخول المشرف</h2><p>اختر الاسم ثم أدخل كلمة السر الحالية.</p></div><button class="btn secondary back-roles"><i class="ph ph-arrow-right"></i> رجوع</button></div>
        <div id="supervisorCards" class="supervisor-cards"></div>
        <div class="field supervisor-password"><label>كلمة السر</label><input id="loginSupervisorPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••"></div>
        <div class="login-submit"><button id="supervisorLoginButton" class="btn primary" disabled><i class="ph ph-sign-in"></i> دخول الموافقات</button></div>
    </section>

    <section id="staffLoginPanel" class="card login-panel hidden">
        <div class="title-row"><div><h2>دخول الإدارة</h2><p>اختر الجهة وأدخل كلمة المرور المعتمدة للنظام.</p></div><button class="btn secondary back-roles"><i class="ph ph-arrow-right"></i> رجوع</button></div>
        <div class="grid">
            <div class="field wide"><label>الجهة</label><select id="loginStaffRole"><option value="">اختر الجهة</option></select></div>
            <div class="field"><label>كلمة السر</label><input id="loginStaffPassword" type="password" autocomplete="current-password" placeholder="••••••"></div>
        </div>
        <div class="login-submit"><button id="staffLoginButton" class="btn primary"><i class="ph ph-sign-in"></i> دخول</button></div>
    </section>
</div>
<script type="module" src="app.js?v=20260922_firestore_users_v4"></script>
</body>
</html>
