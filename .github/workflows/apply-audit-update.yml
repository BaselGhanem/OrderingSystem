name: Apply Audit Table Update

on:
  push:
    branches:
      - beforeChatGPT
    paths:
      - .github/workflows/apply-audit-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beforeChatGPT
          fetch-depth: 0

      - name: Build updated audit page
        shell: bash
        run: |
          cat .audit-update/part1 .audit-update/part2 .audit-update/part3 .audit-update/part4 .audit-update/part5 > /tmp/audit.html.gz.b64
          base64 --decode /tmp/audit.html.gz.b64 | gzip --decompress > audit.html
          grep -q 'data-sort-key="date"' audit.html
          grep -q 'class="audit-nav-pair"' audit.html
          grep -q 'colspan="7"' audit.html
          ! grep -q '<th>تدقيق</th>' audit.html
          ! grep -q '<th>تصدير</th>' audit.html
          ! grep -q '<th>طباعة</th>' audit.html

      - name: Commit audit update
        shell: bash
        run: |
          rm -rf .audit-update
          rm -f .github/workflows/apply-audit-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.html .audit-update .github/workflows/apply-audit-update.yml
          git commit -m "Simplify and sort audit table"
          git push origin HEAD:beforeChatGPT
