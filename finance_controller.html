<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<link href="favicon.ico?v=20260629_audit_dynamic_notes_fix1" rel="icon"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=yes" name="viewport"/>
<title>Hamza Finance Controller | نظام الطلبيات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="style.css?v=20260813_finance_layout_fix_v5" rel="stylesheet"/>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<meta content="no-cache" http-equiv="Pragma"/>
<meta content="0" http-equiv="Expires"/>
</head>
<body data-page="finance-controller">
<div class="offline-banner" id="offline-banner"><i class="ph ph-wifi-slash"></i> أنت الآن في وضع عدم الاتصال.</div>
<div class="bg-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div></div>
<div class="app-container workflow-page-shell">
<header class="finance-premium-header">
    <div class="finance-title"><span class="finance-title-icon"><i class="ph ph-receipt"></i></span><div><h1>التحكم المالي <span>Finance Controller</span></h1><p>نظام إدارة ومراقبة واعتماد الطلبيات المالية</p></div></div>
    <img alt="Dar Al Dawaa Logo" class="logo" src="https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png"/>
</header>
<main class="finance-premium-main">
    <section class="finance-summary"><div class="finance-summary-item"><span class="finance-summary-icon"><i class="ph ph-files"></i></span><div><span>إجمالي عدد الطلبيات</span><strong id="ordersCount">0</strong></div></div><div class="finance-summary-item"><span class="finance-summary-icon"><i class="ph ph-wallet"></i></span><div><span>إجمالي قيمة الطلبيات</span><strong id="ordersValue">0.00 د.ا</strong></div></div></section>
    <section class="workflow-filters finance-filters">
        <div><label>من تاريخ</label><input id="filterDateFrom" type="date"></div>
        <div><label>إلى تاريخ</label><input id="filterDateTo" type="date"></div>
        <div><label>الصيدلية</label><input id="filterPharmacy" type="search" placeholder="بحث بالصيدلية أو الكود"></div>
        <div><label>الحالة</label><select id="filterStatus"><option value="">الكل</option><option value="finance_pending">بانتظار المالية</option><option value="finance_rejected">مرفوض مالياً</option><option value="returned_to_finance">مرجعة للمالية</option></select></div>
        <div class="finance-filter-actions"><button class="btn-secondary" id="financeExportVisibleBtn" type="button"><i class="ph ph-download-simple"></i> تصدير كل الظاهر</button><button class="btn-success" id="financeExportSelectedBtn" type="button"><i class="ph ph-file-xls"></i> تصدير المحدد</button></div>
    </section>
    <div class="finance-table-heading"><div><h2>الطلبيات المالية</h2><p><i class="ph ph-arrows-down-up"></i> اضغط على عنوان العمود للترتيب تصاعدياً أو تنازلياً</p></div></div>
    <div class="table-responsive workflow-table-wrap">
        <table class="order-table workflow-table finance-workflow-table">
            <thead><tr><th><input id="selectAllWorkflow" type="checkbox"></th><th data-sort="date"><button class="finance-sort-btn" type="button">التاريخ <i class="ph ph-caret-up-down"></i></button></th><th data-sort="time"><button class="finance-sort-btn" type="button">الوقت <i class="ph ph-caret-up-down"></i></button></th><th data-sort="pharmacyCode"><button class="finance-sort-btn" type="button">كود الصيدلية <i class="ph ph-caret-up-down"></i></button></th><th data-sort="pharmacyName"><button class="finance-sort-btn" type="button">اسم الصيدلية <i class="ph ph-caret-up-down"></i></button></th><th data-sort="representative"><button class="finance-sort-btn" type="button">المندوب <i class="ph ph-caret-up-down"></i></button></th><th data-sort="note"><button class="finance-sort-btn" type="button">ملاحظة الطلبية <i class="ph ph-caret-up-down"></i></button></th><th data-sort="value"><button class="finance-sort-btn" type="button">قيمة الطلبية <i class="ph ph-caret-up-down"></i></button></th><th data-sort="status"><button class="finance-sort-btn" type="button">الإجراءات المالية <i class="ph ph-caret-up-down"></i></button></th></tr></thead>
            <tbody id="financeOrdersBody"><tr><td colspan="9"><div class="skeleton" style="height:40px;width:100%;"></div></td></tr></tbody>
        </table>
    </div>
</main>
</div>
<div id="toast-container"></div>
<script src="js/workflow.js?v=20260813_finance_layout_fix_v5" type="module"></script>
</body>
</html>
