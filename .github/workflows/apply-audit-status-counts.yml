name: Apply Audit Status Counts

on:
  push:
    branches:
      - beforeChatGPT
    paths:
      - .github/workflows/apply-audit-status-counts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beforeChatGPT
          fetch-depth: 0

      - name: Build updated audit page
        shell: bash
        run: |
          cat .audit-status-counts/part1 .audit-status-counts/part2 .audit-status-counts/part3 .audit-status-counts/part4 > /tmp/audit.html.gz.b64
          base64 --decode /tmp/audit.html.gz.b64 | gzip --decompress > audit.html
          grep -q 'showCounts = false' audit.html
          grep -q 'normalizedValues.length.toLocaleString' audit.html
          grep -q 'WORKFLOW_STATUS_LABELS, `كل الحالات`, true' audit.html
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('audit.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          if not match:
              raise SystemExit('Module script was not found')
          Path('/tmp/audit.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/audit.js

      - name: Commit audit update
        shell: bash
        run: |
          rm -rf .audit-status-counts
          rm -f .github/workflows/apply-audit-status-counts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit.html .audit-status-counts .github/workflows/apply-audit-status-counts.yml
          git commit -m "Show dynamic counts in audit status filter"
          git push origin HEAD:beforeChatGPT
