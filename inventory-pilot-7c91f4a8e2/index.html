<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>نظام الطلبيات | النسخة التجريبية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260727_3">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div id="offlineBanner" class="offline-banner"><i class="ph ph-wifi-slash"></i> لا يوجد اتصال بالإنترنت</div>

    <main class="app-shell">
        <header class="topbar glass">
            <div class="brand">
                <img src="https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png" alt="Dar Al Dawa">
                <div><strong>نظام الطلبيات</strong><span>Inventory Pilot</span></div>
            </div>
            <div class="top-actions">
                <span id="activeUserBadge" class="user-badge" hidden></span>
                <button id="homeBtn" class="icon-btn" type="button" title="تسجيل الخروج" hidden><i class="ph ph-sign-out"></i></button>
            </div>
        </header>

        <section id="roleScreen" class="role-screen">
            <div class="hero-copy">
                <span class="eyebrow"><i class="ph ph-sparkle"></i> النسخة التجريبية</span>
                <h1>اختر بوابة الدخول</h1>
                <p>كل بوابة تستخدم نفس كلمة المرور وآلية الدخول المعتمدة في النظام الحالي.</p>
            </div>
            <div class="role-grid">
                <button class="role-card rep-card" data-role="rep" type="button">
                    <span class="role-icon"><i class="ph ph-user-circle"></i></span>
                    <span class="role-copy"><strong>مندوب</strong><small>طلبية جديدة، طلبياتي، وأرصدة البضاعة</small></span>
                    <i class="ph ph-arrow-left card-arrow"></i>
                </button>
                <button class="role-card supervisor-card" data-role="supervisor" type="button">
                    <span class="role-icon"><i class="ph ph-users-three"></i></span>
                    <span class="role-copy"><strong>Supervisor</strong><small>لوحة الفريق الكاملة، الطلبات، والمخزون</small></span>
                    <i class="ph ph-arrow-left card-arrow"></i>
                </button>
                <button class="role-card manager-card" data-role="manager" type="button">
                    <span class="role-icon"><i class="ph ph-chart-donut"></i></span>
                    <span class="role-copy"><strong>Manager</strong><small>لوحة التقارير وتقرير أرصدة البضاعة</small></span>
                    <i class="ph ph-arrow-left card-arrow"></i>
                </button>
            </div>
        </section>

        <section id="dashboardScreen" class="dashboard-screen" hidden>
            <nav id="dashboardNav" class="dashboard-nav glass"></nav>
            <div id="dashboardContent"></div>
        </section>
    </main>

    <div id="selectionModal" class="modal-layer" hidden>
        <section class="modal-card glass">
            <button class="modal-close" data-close-modal type="button"><i class="ph ph-x"></i></button>
            <div id="selectionModalContent"></div>
        </section>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script type="module" src="app.js?v=20260727_3"></script>
</body>
</html>
